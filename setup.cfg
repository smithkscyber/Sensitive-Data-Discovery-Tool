# Mutation testing: how good are the tests, rather than how good is the code.
#
# A passing suite proves the tests agree with the code. It does not prove the
# tests would notice if the code changed. mutmut settles that by deliberately
# breaking things -- flipping a comparison, deleting a guard, swapping an
# operator -- and re-running the tests against each broken version. A mutant
# the tests still pass is a line nothing is actually checking.
#
#     mutmut run           # mutate and score
#     mutmut results       # the mutants that survived
#     mutmut show <id>     # the exact edit the tests did not notice
#
# Scoped to the regex detector on purpose, and the scope is the honest part of
# the claim. It is the file where a silent change does the most damage -- a
# loosened SSN boundary or an inverted Luhn check would keep every test green
# while quietly changing what the tool reports -- and its tests run in about a
# second, so every mutant can be tried. The Presidio detector cannot be scored
# this way at any sensible cost: each mutant would reload a 560MB language
# model. That half is covered by the corpus score, the external benchmark and
# the hand-run mutations recorded in the README instead.
[mutmut]
paths_to_mutate = src/detectors/regex_detector.py
tests_dir = tests/
runner = venv/bin/python -m pytest -x -q --no-header -p no:cacheprovider tests/test_regex_detector.py
